name: Build and Release

on:
  push:
    tags:
      - "v*" # e.g. v1.0.0 — must match "version" in package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 43 downloads its binary on first use; the bytecode build needs it up front.
      - name: Download Electron
        run: node node_modules/electron/install.js

      - name: Test
        run: npm test

      - name: Build Windows installer and portable exe
        run: npm run dist:win

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          # latest.yml + .blockmap let installed copies auto-update.
          files: |
            release/Companion-Setup-*.exe
            release/Companion-Setup-*.exe.blockmap
            release/Companion-*-portable.exe
            release/latest.yml
